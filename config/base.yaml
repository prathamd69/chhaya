# pipeline/config/base.yaml

environment: dev

aws:
  region: ap-south-1
  bucket: chhaya-delhi

# Shared fixtures — uploaded once, read by everyone
fixtures:
  s3_prefix: fixtures/
  files:
    delhi_boundary: fixtures/delhi.geojson
    hex_grid:       fixtures/delhi_hex_res8.parquet

# Local scratch — downloaded per-run, never uploaded
local:
  raw_dir: data/raw
  derived_dir: data/derived

# Pipeline outputs — written by pipeline, read by API
artifacts:
  s3_prefix: features/
  files:
    cells_parquet:     features/cells.parquet
    cells_geojson:     features/cells.geojson
    # heat_model:        model/heat.pkl
    pollution_latest:  features/pollution_latest.parquet